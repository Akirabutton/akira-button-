<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c9effa"><meta name="description" content="お気に入りの声を、ひと押しで。水色のボイスボタンサイト。"><title>あきらボタン</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="./"><span class="brandmark">♫</span><span>あきらボタン</span></a><button id="settings" class="quiet">⚙ サイト名</button></header>
<main><section class="hero"><div class="hero-text"><span class="eyebrow">YOUR LITTLE VOICE COLLECTION</span><h1 id="title">あきらボタン<span class="dot">.</span></h1><p>好きな声を、ひと押しで。<br>何度でも聴きたくなる、あのひとこと。</p><div class="hero-tags"><span>♫ <b id="ready">0</b> 個の音声</span><span>スマホでも、PCでも</span></div></div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="disc"><div class="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><span>tap & listen</span></div><span class="spark s1">✧</span><span class="spark s2">✦</span><span class="bubble">hello!</span></div></section>
<section class="collection"><div class="section-head"><div><span class="eyebrow">VOICE LIBRARY</span><h2>ボイスコレクション <span id="count">300</span></h2></div><button class="primary" id="add">＋ 音声を追加</button></div>
<div class="notice" id="notice">公開データを読み込んでいます…</div>
<div class="tools"><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="聴きたいボイスを検索" aria-label="ボイス検索"></label><label class="volume">音量 <input id="volume" type="range" min="0" max="100" value="80"><span id="volnum">80%</span></label></div>
<nav class="filters" id="filters" aria-label="カテゴリー"></nav><div class="results"><span id="resultcount"></span><button id="random" class="quiet">⤨ ランダム再生</button></div><div class="grid" id="grid"></div><p id="empty" hidden>該当するボイスはありません。</p></section>
<footer>あきらボタン <span>今日も、お気に入りの声と。</span></footer></main>
<div class="player"><div class="player-icon">♫</div><div class="track"><small id="playerstatus">READY TO PLAY</small><strong id="now">ボタンを押して再生</strong><progress id="progress" max="1" value="0" aria-label="再生位置"></progress></div><button id="stop" class="stop">■ 停止</button></div><div id="toast" role="status"></div>
<input type="file" id="bulk" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" multiple hidden>
<dialog id="editor"><form id="editform"><div class="modal-head"><h2>ボイスを編集</h2><button type="button" id="close" class="quiet" aria-label="閉じる">✕</button></div><label>ボタンに表示する名前<input id="label" maxlength="80" required></label><label>カテゴリー<select id="category"><option>未分類</option><option>あいさつ</option><option>リアクション</option><option>笑い声</option><option>その他</option></select></label><label>音声ファイル<input id="file" type="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac"></label><small id="filename"></small><div class="modal-actions"><button type="button" id="remove" class="quiet danger">このボタンを削除</button><button class="primary" type="submit">保存する</button></div></form></dialog>
<script src="app.js"></script></body></html>
